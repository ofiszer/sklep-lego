<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Brick Shop - Sklep kolekcjonerski</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- NAGLOWEK -->
    <header>
      <div class="logo">Tematyka</div>

      <nav>
        <a href="index.html">Strona główna</a>
        <a href="#">Zestawy</a>
        <a href="#">Figurki</a>
        <a href="themes.html">Tematyka</a>
        <a href="#">Pojedyncze klocki</a>
        <a href="#">Kolekcjonerskie</a>
        <a href="#">Nowości</a>
        <a href="#">Ostatnie sztuki</a>
        <a href="#">Kontakt</a>
      </nav>

      <div class="header-icons">
        <button aria-label="Wyszukaj">⌕</button>
        <button id="cart-toggle" aria-label="Otwórz koszyk">
          🛒 <span id="cart-count">0</span>
        </button>
      </div>
    </header>

    <section class="hero">
      <img src="images/sklep.jpg" alt="Kolekcja figurek i zestawów" />
    </section>

    <section class="categories" id="kategorie">
      <h2>Odkryj naszą selekcję tematyczną</h2>

      <div class="category-grid">
        <a href="#" class="category-card">
          <img src="images/tematyka.jpg" alt="Star Wars" />
          <h3>Star Wars</h3>
        </a>

        <a href="#" class="category-card">
          <img src="images/tematyka.jpg" alt="City" />
          <h3>City</h3>
        </a>

        <a href="#" class="category-card">
          <img src="images/tematyka.jpg" alt="Batman I" />
          <h3>Batman I</h3>
        </a>

        <a href="#" class="category-card">
          <img src="images/tematyka.jpg" alt="Spider-Man" />
          <h3>Spider-Man</h3>
        </a>

        <a href="#" class="category-card">
          <img src="images/tematyka.jpg" alt="Lord of the Rings" />
          <h3>Lord of the Rings</h3>
        </a>

        <a href="#" class="category-card">
          <img src="images/tematyka.jpg" alt="Super Heroes" />
          <h3>Super Heroes</h3>
        </a>
      </div>
    </section>
  </body>
</html>
